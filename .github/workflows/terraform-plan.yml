name: Terraform plan workflow
on:
  push:
    branches-ignore:
      - main # Runs on all feature branches
  pull_request:
    branches:
      - main # Runs on PR targeting main
env:
  AWS_REGION: "ca-central-1"
permissions:
  contents: read
  id-token: write
  pull-requests: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Git clone the respository
        uses: actions/checkout@v6

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::013310058149:role/plan-role
          role-session-name: samplerolesession
          aws-region: ${{ env.AWS_REGION }}

        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform init
        id: init
        run: terraform init -input=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color -input=false

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - uses: actions/github-script@v7
        if: github.event_name == "pull_request"
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            ### Terraform Initialization \`${{ steps.init.outcome }}\`
            ### Terraform Validation \`${{ steps.validate.outcome }}\`
            <details><summary>Validation output</summary>
            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
           \`\`\`
           </details>
           ### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
           <details><summary>Show Plan</summary>
           \`\`\`\n
           ${{ process.env.PLAN }}
           \`\`\`
          </details>

          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.tf_actions_working_dir }}\`, Workflow: \`${{ github.workflow }}\`*`;

          github.rest.issues.createComment({
            issuer_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
           })
