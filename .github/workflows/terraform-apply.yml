name: Terraform apply jon
on:
  push:
    branches:
      - main # Triggers only when code hits the main branch
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: "ca-central-1"
jobs:
  organization:
    defaults:
      run:
        working-directory: ./envs/organization
    environment: production
    runs-on: ubuntu-24.04
    steps:
    - name: Git clone the repository
      uses: actions/checkout@v4

    - name: Configure aws action
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::013310058149:role/apply-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup terraform
      uses: hashicorp/setup-terraform@v4

    - run: terraform init

    - run: terraform plan && terraform validate

    - run: terraform apply -auto-approve
  members:
    env:
      AWS_REGION: "ca-central-1"
      TF_VAR_execution_role_name: "terraform-deploy"
    needs: organization
    environment: production
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dev, dir: ./envs/dev }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
    - name: Git clone the repository
      uses: actions/checkout@v4

    - name: Configure aws action
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::013310058149:role/apply-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup terraform
      uses: hashicorp/setup-terraform@v4

    - run: terraform init

    - run: terraform plan && terraform validate

    - run: terraform apply -auto-approve
