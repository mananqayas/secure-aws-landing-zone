name: Terraform apply jon
on:
  push:
    branches:
      - main # Triggers only when code hits the main branch
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: "ca-central-1"
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
    - name: Git clone the repository
      uses: actions/checkout@v4
    - name: test whoami
      run: whoami


